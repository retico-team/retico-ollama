[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "retico-ollama"
dynamic = ["version"]
authors = [
    { name = "Dalton Bilau Goncalves", email = "daltonbilaugoncalves@gmail.com" }
]
dependencies = [
    "retico-core>=2.0.0",
    "ollama",
]
requires-python = ">=3.8"
description = "Retico module for incremental text generation using local LLMs via Ollama"
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
    "retico",
    "framework",
    "incremental",
    "ollama",
    "llm",
    "dialogue",
    "language generation"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
mic = [
    "retico-whisperasr",
]

[project.urls]
Repository = "https://github.com/retico-team/retico-ollama"

[tool.setuptools_scm]
version_file = "retico_ollama/version.py"
